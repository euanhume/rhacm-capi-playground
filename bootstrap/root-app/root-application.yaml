apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhacm-operator
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/euanhume/rhacm-capi-playground.git
    targetRevision: main
    path: rhacm-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
